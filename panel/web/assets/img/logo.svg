<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Simorgh">
  <title>Simorgh</title>
  <!--
    An original mark, not a trace of anyone else's: a simorgh rising, drawn as
    two swept wings over a tail, inside the ring the bird returns through.

    Uses currentColor throughout so it inherits the panel's --accent in all
    three themes (light #008771, dark #1bbf9f, ultra-dark #59cbac) instead of
    pinning a colour that would go wrong in two of them.
  -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3" opacity=".28"/>
  <path d="M32 13c-9.4 0-16.6 6-16.6 13.7 0 5.2 3.3 8.6 8.2 10.7L14 53l18-9.6L50 53l-9.6-15.6c4.9-2.1 8.2-5.5 8.2-10.7C48.6 19 41.4 13 32 13z"
        fill="currentColor"/>
  <path d="M32 19.5c-5.6 0-9.8 3.4-9.8 7.8 0 2.6 1.6 4.4 4 5.7L32 36l5.8-3c2.4-1.3 4-3.1 4-5.7 0-4.4-4.2-7.8-9.8-7.8z"
        fill="#fff" opacity=".9"/>
</svg>
