<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Simorgh">
  <title>Simorgh</title>
  <desc>Two swept wings above a tail, enclosed in a ring.</desc>
  <!--
    An original mark: a simorgh rising, wings swept back over a tail, inside the
    ring the bird returns through.

    Drawn as SOLID shapes rather than strokes, and that is the whole reason this
    version replaced the first one. The sidebar renders it at 32px and the
    collapsed rail at 20px, where thin strokes grey into mush and any inner
    detail closes up. A filled silhouette survives being shrunk; line art does
    not.

    currentColor throughout, so it inherits the panel's --accent in all three
    themes (light #008771, dark #1bbf9f, ultra-dark #59cbac). A pinned colour
    would be wrong in two of them, and a mark that only works on one background
    is not a mark.

    The tail carries its own opacity rather than being knocked out in white:
    white would punch a hole straight through the shape on any surface that is
    not white, which is exactly what the previous version did on the dark theme.
  -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".3"/>
  <path d="M14 40 C18 24 24 16 32 12 C40 16 46 24 50 40 C42 33 37 30 32 30 C27 30 22 33 14 40 Z"
        fill="currentColor"/>
  <path d="M32 34 C29 40 27 46 27 52 L32 47 L37 52 C37 46 35 40 32 34 Z"
        fill="currentColor" opacity=".55"/>
</svg>
